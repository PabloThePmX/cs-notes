version: '3.8'
services:

  banco:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: teste
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  api:
    image: python:3.12-alpine
    command: sleep infinity
    volumes:
      - ./api:/app

volumes:
  pgdata: